<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>CineMaster Stream - Smart TV Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #090a0e; --panel-color: #141821; --accent-color: #cf0202; --text-color: #e3e8f0; --border-color: #262f3d; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; overflow-x: hidden; }

        .page-wrapper { display: flex; flex-direction: column; width: 100vw; height: 100vh; box-sizing: border-box; }

        .tv-container { 
            position: relative; 
            width: 100%; 
            height: calc(100vh - 230px); 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        
        iframe, video { width: 100%; height: 100%; border: none; background: #000; position: absolute; top: 0; left: 0; z-index: 1; display: none; }

        #embedFrame { 
            z-index: 2; 
            width: 106% !important; 
            height: 112% !important; 
            top: -6% !important; 
            left: -3% !important; 
        }

        /* JAVÍTVA: Árnyékolás (filter) kiszedve */
        .tv-watermark { 
            position: absolute; 
            opacity: 0.9; 
            pointer-events: none; 
            z-index: 1001 !important; 
            display: block; 
            height: auto !important;
        }

        /* ÚJ: Korhatár logó stílusa (Árnyékolás nélkül, z-index a watermark szintjén) */
        .tv-rating {
            position: absolute;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1001 !important;
            display: none;
            height: auto !important;
        }

        /* ÚJ: Magyarországi pontos idő - csak Best Hits TV csatornán, a logó alatt */
        .hu-clock {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 1001 !important;
            font-family: 'Zen Dots', cursive;
            color: #7ec8ff;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .show-notifier-band { 
            position: absolute; 
            top: 7.5%; 
            right: -100%; 
            left: auto;
            width: 70%; 
            height: 8.5%; 
            min-height: 42px; 
            max-height: 54px; 
            background: rgba(20, 24, 33, 0.85); 
            backdrop-filter: blur(8px); 
            border-bottom: 3px solid var(--accent-color); 
            border-bottom-left-radius: 8px; 
            z-index: 1000 !important; 
            display: flex; 
            align-items: center; 
            padding: 0 30px; 
            box-sizing: border-box; 
            transition: right 0.5s ease-in-out; 
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5); 
            pointer-events: none; 
        }
        .show-notifier-band.active { 
            right: 0; 
        }
        
        .notifier-live-text { 
            color: #ff1744; 
            font-size: 1.65vw; 
            min-font-size: 18px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-right: 10px; 
            letter-spacing: 1px; 
        }
        
        .notifier-title { 
            font-size: 1.65vw; 
            min-font-size: 18px; 
            font-weight: bold; 
            color: #ffffff; 
            text-transform: uppercase; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .info-bar { 
            width: 100%; 
            height: 230px; 
            background: var(--panel-color); 
            border-top: 1px solid var(--border-color); 
            padding: 20px 2%; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            z-index: 10; 
        }

        .info-top-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .info-left { display: flex; flex-direction: column; }

        /* ÚJ: KILÉPÉS gomb a cím-sor jobb oldalán */
        .exit-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .exit-btn:hover { transform: scale(1.05); }
        .exit-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px #ffffff;
        }
        .badge-live { background: #ff1744; color: white; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; width: max-content; margin-bottom: 6px; }
        .show-title { font-size: 24px; font-weight: bold; color: #fff; }
        .time-info { font-size: 20px; font-weight: bold; color: #8a99ad; margin-left: 15px; }
        
        .controls-right { display: flex; gap: 15px; align-items: center; }

        /* ÚJ: EPG és Teljes Képernyő gombok most már logó-képek, nem szöveges gombok */
        .icon-btn {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            line-height: 0;
            border-radius: 14px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }
        .icon-btn img {
            display: block;
            height: 75px;
            width: auto;
            border-radius: 14px;
        }
        .icon-btn:hover { transform: scale(1.06); }
        /* Enyhe vizuális elválasztás a csatornaikonok és az EPG/Teljes képernyő ikonok között */
        .channel-btn + .icon-btn { margin-left: 10px; }

        .channel-selector { display: flex; gap: 12px; width: 100%; justify-content: flex-start; overflow-x: auto; padding-bottom: 8px; align-items: center; }

        /* ÚJ: a csatornagombok is logó-képek; az aktív csatornát fehér szegély jelzi
           (a korábbi kék háttér/box-shadow kiemelés helyett) */
        .channel-btn {
            background: transparent;
            border: 3px solid transparent;
            padding: 3px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            line-height: 0;
            flex-shrink: 0;
        }
        .channel-btn img {
            display: block;
            height: 75px;
            width: auto;
            border-radius: 12px;
        }
        .channel-btn:hover { transform: scale(1.05); }
        .channel-btn.active {
            border-color: #ffffff;
            box-shadow: 0 0 14px rgba(255,255,255,0.55);
        }
        /* ÚJ: külön, jól látható jelzés a távirányítóval/nyilakkal fókuszált gombon -
           ez megkülönböztethető az "éppen ez megy" fehér kerettől (lehet egyszerre a kettő). */
        .channel-btn:focus-visible,
        .icon-btn:focus-visible,
        #epgCloseBtn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--accent-color);
        }
        #epgCloseBtn:focus-visible { box-shadow: 0 0 0 3px #ffffff; }

        .epg-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000000000 !important; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .epg-modal-overlay.active { opacity: 1; pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        .epg-modal { width: 90%; max-width: 650px; background: #12161f; border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; box-sizing: border-box; max-height: 80vh; display: flex; flex-direction: column; }
        
        .no-stream-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: transparent; background: #000000; z-index: 995; pointer-events: none; }
        
        .unlock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f1115; z-index: 200001; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        .unlock-btn { background: var(--accent-color); color: white; border: none; padding: 22px 50px; font-size: 24px; font-weight: bold; border-radius: 14px; cursor: pointer; }

        :fullscreen .tv-container { width: 100vw; height: 100vh; }
        :-webkit-full-screen .tv-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="unlockOverlay" class="unlock-overlay">
    <div style="font-size: 32px; font-weight: bold; color: #fff; letter-spacing: 2px; margin-bottom: 10px;">CINEMASTER TV</div>
    <button class="unlock-btn" onclick="startTvWithAudio(event)">ÉLŐ ADÁS INDÍTÁSA 🔊</button>
</div>

<div class="page-wrapper" id="pageWrapper">

    <div class="tv-container" id="mainTvContainer">
        <div id="showNotifier" class="show-notifier-band">
            <span id="notifierLiveText" class="notifier-live-text">MOST:</span>
            <span id="notifierTitle" class="notifier-title">Műsor címe</span>
        </div>

        <div id="noStreamOverlay" class="no-stream-overlay"></div>
        
        <video id="tvEngine" autoplay></video>
        <iframe id="archiveEngine" allowfullscreen style="display: none;"></iframe>
        
        <img id="tvWatermark" class="tv-watermark" alt="Logo">
        <img id="tvRating" class="tv-rating" alt="Rating">
        <div id="huClock" class="hu-clock">--:--:--</div>
    </div>

    <div class="info-bar" id="mainInfoBar">
        <div class="info-top-row">
            <div class="info-left">
                <div class="badge-live">Élő adás</div>
                <div style="display: flex; align-items: center;">
                    <span class="show-title" id="lblShow">Betöltés...</span>
                    <span class="time-info" id="lblTime">--:--</span>
                </div>
            </div>
            <button class="exit-btn" onclick="exitApp()">KILÉPÉS</button>
        </div>
        
        <div class="channel-selector" id="channelButtonsContainer">
            <button class="channel-btn active" onclick="switchChannel('cinemaster')" aria-label="CineMaster">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea6c7536c0.jpg" alt="CineMaster">
            </button>
            <button class="channel-btn" onclick="switchChannel('cinemaster2')" aria-label="CineMaster 2">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea6d801506.jpg" alt="CineMaster 2">
            </button>
            <button class="channel-btn" onclick="switchChannel('retrotv')" aria-label="RetroTV">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea6df9c842.jpg" alt="RetroTV">
            </button>
            <button class="channel-btn" onclick="switchChannel('besthits')" aria-label="Best Hits TV">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea6ec965df.jpg" alt="Best Hits TV">
            </button>
            <button class="icon-btn" onclick="toggleEpg(true)" aria-label="Műsorújság (EPG)">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea6f694357.jpg" alt="Műsorújság (EPG)">
            </button>
            <button class="icon-btn" onclick="toggleNativeFullscreen()" aria-label="Teljes Képernyő">
                <img src="https://img.catcast.tv/uploads/19092026/logos/15170-6aaea700baa5d.jpg" alt="Teljes Képernyő">
            </button>
        </div>
    </div>

    <div id="epgModalOverlay" class="epg-modal-overlay" onclick="toggleEpg(false)">
        <div class="epg-modal" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="epgModalTitle" style="margin:0; font-size:24px; color:white;">Műsorújság</h3>
                <button id="epgCloseBtn" onclick="toggleEpg(false)" style="background: var(--accent-color); color:white; border:none; padding:10px 22px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;">Bezárás ✕</button>
            </div>
            <div id="epgRowsContainer" style="overflow-y:auto; flex-grow:1;"></div>
        </div>
    </div>

</div>

<script>
const pageWrapper = document.getElementById('pageWrapper');
const container = document.getElementById('mainTvContainer');
const overlay = document.getElementById('noStreamOverlay');
const watermark = document.getElementById('tvWatermark');
const ratingImg = document.getElementById('tvRating'); // ÚJ ELÉRÉS
const lblShow = document.getElementById('lblShow');
const lblTime = document.getElementById('lblTime');
const epgModalOverlay = document.getElementById('epgModalOverlay');
const epgRowsContainer = document.getElementById('epgRowsContainer');
const epgModalTitle = document.getElementById('epgModalTitle');
const epgCloseBtn = document.getElementById('epgCloseBtn'); // ÚJ: bezárás gomb

const showNotifier = document.getElementById('showNotifier');
const notifierTitle = document.getElementById('notifierTitle');
const notifierLiveText = document.getElementById('notifierLiveText'); // ÚJ: a "MOST:" felirat eleme

// ÚJ: csatornánként eltérő szín a "MOST:" feliraton és a sáv alsó csíkján
const CHANNEL_NOTIFIER_COLORS = {
    cinemaster: '#cf0202',
    cinemaster2: '#29ba30',
    retrotv: '#f58d05',
    besthits: '#07cee8'
};

const vid = document.getElementById('tvEngine');
const archiveIframe = document.getElementById('archiveEngine');

const huClock = document.getElementById('huClock'); // ÚJ: magyar óra elem

let activeChannel = 'cinemaster';
let lastRenderedUrl = '';
let currentLogoConfig = null;
let currentRatingConfig = null; // ÚJ TÁROLÓ
let currentTrackRatio = "";
let isEpgOpen = false;
let userUnlocked = false;
let isIframeLoaded = false; 

let forceBlackoutActive = false;

function startTvWithAudio(e) {
    e.stopPropagation();
    userUnlocked = true;
    document.getElementById('unlockOverlay').style.display = 'none';
    vid.muted = false;
    vid.volume = 1.0;
    runTvEngine();
    // ÚJ: feloldás után azonnal fókuszáljuk az aktív csatornagombot, hogy a
    // távirányító/billentyűzet nyilaival rögtön navigálni lehessen
    const activeBtn = document.querySelector('#channelButtonsContainer .channel-btn.active');
    if (activeBtn) activeBtn.focus();
}

vid.onended = function() {
    lastRenderedUrl = '';
    isIframeLoaded = false; 
    triggerBlackoutIncert(); 
    runTvEngine();
};

function parseLocalISO(isoStr) {
    let clean = isoStr.replace('Z', '').split('+')[0];
    let parts = clean.split(/[-T:]/);
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), parseInt(parts[3]), parseInt(parts[4]), parseInt(parts[5]) || 0);
}

function updateFontSizes() {
    const baseWidth = container.clientWidth;
    const computedFontSize = Math.max(18, baseWidth * 0.0165); 
    const textEls = document.querySelectorAll('.notifier-live-text, .notifier-title');
    textEls.forEach(el => { if(el) el.style.fontSize = computedFontSize + 'px'; });

    // ÚJ: az óra betűmérete is a konténer szélességéhez igazodik
    const clockFontSize = Math.max(14, baseWidth * 0.015);
    huClock.style.fontSize = clockFontSize + 'px';
}

function toggleEpg(show) {
    isEpgOpen = show;
    if (show) {
        epgModalTitle.innerText = "Műsorújság";
        epgModalOverlay.classList.add('active');
        // ÚJ: azonnal fókuszáljuk a Bezárás gombot, hogy a távirányító OK/Enter
        // gombjával rögtön be lehessen zárni (arra az esetre, ha a Vissza/Exit
        // gomb nem küld a böngésző által felismert billentyűkódot).
        setTimeout(() => { epgCloseBtn.focus(); }, 0);
    } else {
        epgModalOverlay.classList.remove('active');
    }
}

function toggleNativeFullscreen() {
    if (!document.fullscreenElement) {
        container.requestFullscreen().then(() => setTimeout(updateLayersScale, 100)).catch(err => console.log(err));
    } else {
        document.exitFullscreen();
    }
}

// ÚJ: kilépés az oldalról/appból. A window.close() a legtöbb "sima" böngészőben
// biztonsági okból csak akkor enged be, ha az ablakot script nyitotta - viszont
// sok Smart TV böngésző/kiosk-app rendes lapokra is engedélyezi.
function exitApp() {
    window.close();
}

document.addEventListener('fullscreenchange', () => {
    setTimeout(() => { updateLayersScale(); updateFontSizes(); }, 100);
});

// ÚJ: nyilakkal / távirányítóval történő navigáció a gombsorban (csatornák + EPG + Teljes képernyő).
// Az Enter/OK gomb aktiválása natívan működik, mert ezek valódi <button> elemek -
// ehhez nem kell külön kód, a böngésző/TV-platform ezt magától megcsinálja.
function getNavigableButtons() {
    return Array.from(document.querySelectorAll('#channelButtonsContainer button'));
}

function focusAdjacentButton(direction) {
    const buttons = getNavigableButtons();
    if (buttons.length === 0) return;
    const currentIndex = buttons.indexOf(document.activeElement);
    let nextIndex;
    if (currentIndex === -1) {
        // Ha semmi sincs fókuszban, az éppen játszott csatornánál kezdjük
        const activeBtn = document.querySelector('#channelButtonsContainer .channel-btn.active');
        nextIndex = activeBtn ? buttons.indexOf(activeBtn) : 0;
    } else {
        nextIndex = currentIndex + direction;
    }
    if (nextIndex < 0) nextIndex = 0;
    if (nextIndex >= buttons.length) nextIndex = buttons.length - 1;
    buttons[nextIndex].focus();
}

window.addEventListener('keydown', function(e) {
    const isBackKey = (e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009);
    if (isBackKey) {
        if (isEpgOpen) {
            e.preventDefault();
            toggleEpg(false);
            return;
        }
        if (document.fullscreenElement) {
            e.preventDefault();
            document.exitFullscreen();
        }
        return;
    }

    if (isEpgOpen) return; // EPG nyitva - ne navigáljunk a háttérben lévő gombsorban

    if (e.key === 'ArrowRight' || e.keyCode === 39) {
        e.preventDefault();
        focusAdjacentButton(1);
    } else if (e.key === 'ArrowLeft' || e.keyCode === 37) {
        e.preventDefault();
        focusAdjacentButton(-1);
    }
});

// EGYESÍTETT MEGJELENÍTÉSI MOTOR (Dinamikus méret-számítás mindkét JSON-höz)
function updateLayersScale() {
    if (currentLogoConfig && currentLogoConfig.url) {
        const finalSizePx = container.clientWidth * (currentLogoConfig.size / 440);
        watermark.style.width = finalSizePx + 'px';
        watermark.style.top = currentLogoConfig.topPercent + '%';
        let logoLeftPercent = currentLogoConfig.leftPercent;
        if (currentTrackRatio === '4:3') {
            if (activeChannel === 'retrotv') {
                logoLeftPercent = 10.9904013961605584;
            } else if (activeChannel === 'cinemaster' || activeChannel === 'cinemaster2') {
                logoLeftPercent = 73.94991273996509;
            }
        }
        watermark.style.left = logoLeftPercent + '%';
    }
    if (currentRatingConfig && currentRatingConfig.url) {
        const finalSizePx = container.clientWidth * (currentRatingConfig.size / 440);
        ratingImg.style.width = finalSizePx + 'px';
        ratingImg.style.top = currentRatingConfig.topPercent + '%';
        let ratingLeftPercent = currentRatingConfig.leftPercent;
        if (currentTrackRatio === '4:3') {
            ratingLeftPercent = 12.84991273996509;
        }
        ratingImg.style.left = ratingLeftPercent + '%';
    }
    positionHuClock();
}

// ÚJ: a magyar pontos idő elhelyezése a logó alatt, csak a Best Hits TV csatornán
function positionHuClock() {
    if (activeChannel !== 'besthits') {
        huClock.style.display = 'none';
        return;
    }

    huClock.style.display = 'block';

    // ---- ITT ÁLLÍTHATÓ AZ ÓRA POZÍCIÓJA ----
    // extraOffsetTopPx: pozitív érték lejjebb, negatív feljebb tolja az órát a logóhoz képest
    // extraOffsetLeftPx: pozitív érték jobbra, negatív balra tolja az órát a logóhoz képest
    const extraOffsetTopPx = -40;
    const extraOffsetLeftPx = 75;
    // -----------------------------------------

    if (currentLogoConfig && currentLogoConfig.url && watermark.style.display === 'block') {
        // A logó tényleges (renderelt) helyzetéhez igazítjuk, alá pozicionálva
        const containerRect = container.getBoundingClientRect();
        const watermarkRect = watermark.getBoundingClientRect();
        const gapPx = Math.max(6, container.clientWidth * 0.008); // logó és óra közti térköz

        const topPx = (watermarkRect.bottom - containerRect.top) + gapPx + extraOffsetTopPx;
        const leftPx = (watermarkRect.left - containerRect.left) + extraOffsetLeftPx;

        huClock.style.top = topPx + 'px';
        huClock.style.left = leftPx + 'px';
    } else {
        // Ha nincs logó a csatornán, alapértelmezett hely (itt is állítható %-ban)
        huClock.style.top = '4%';
        huClock.style.left = '3%';
    }
}

// ÚJ: a magyarországi pontos idő szövegének frissítése (másodpercenként)
function updateHuClockText() {
    if (activeChannel !== 'besthits') return;
    const now = new Date();
    const timeStr = now.toLocaleTimeString('hu-HU', {
        timeZone: 'Europe/Budapest',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });
    huClock.innerText = timeStr;
}

window.addEventListener('resize', () => setTimeout(() => { updateLayersScale(); updateFontSizes(); }, 50));

function triggerBlackoutIncert() {
    forceBlackoutActive = true;
    overlay.style.display = 'flex';
    setTimeout(() => { forceBlackoutActive = false; }, 2500); 
}

function switchChannel(channelId) {
    activeChannel = channelId;
    lastRenderedUrl = '';
    isIframeLoaded = false; 
    triggerBlackoutIncert(); 
    vid.pause();
    vid.removeAttribute('src');
    vid.load();
    vid.style.display = 'none';
    
    let embedFrame = document.getElementById('embedFrame');
    if (embedFrame) { embedFrame.src = ''; embedFrame.style.display = 'none'; }
    archiveIframe.src = '';
    archiveIframe.style.display = 'none';
    
    document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
    const clickedBtn = Array.from(document.querySelectorAll('.channel-btn')).find(btn => btn.getAttribute('onclick').includes(channelId));
    if(clickedBtn) clickedBtn.classList.add('active');

    updateNotifierColor(); // ÚJ: a "MOST:" felirat és az alsó szegély színe is a csatornához igazodik
    positionHuClock(); // ÚJ: csatornaváltáskor azonnal frissítjük az óra láthatóságát/pozícióját
    updateHuClockText();

    runTvEngine();
}

// ÚJ: a "MOST:" felirat és a sáv alsó csíkjának színbeállítása az aktuális csatorna szerint
function updateNotifierColor() {
    const channelColor = CHANNEL_NOTIFIER_COLORS[activeChannel] || '#ff1744';
    notifierLiveText.style.color = channelColor;
    showNotifier.style.borderBottomColor = channelColor;
}

async function runTvEngine() {
    if (!userUnlocked) return;

    try {
        // CSATORNALOGÓ JSON BETÖLTÉSE
        try {
            const logoResponse = await fetch(`${activeChannel}_logo.json?t=${new Date().getTime()}`);
            if (logoResponse.ok) {
                const logoConfig = await logoResponse.json();
                if (logoConfig.logo && logoConfig.logo.url) {
                    currentLogoConfig = logoConfig.logo;
                    watermark.src = logoConfig.logo.url;
                    watermark.style.display = 'block';
                }
            } else { watermark.style.display = 'none'; currentLogoConfig = null; }
        } catch (e) { watermark.style.display = 'none'; currentLogoConfig = null; }

        let kombináltMűsor = [];
        const baseDate = new Date(new Date().getTime() - 24 * 60 * 60 * 1000); 
        const formázDátum = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        for (let i = 0; i < 7; i++) {
            const vizsgáltDátum = new Date(baseDate.getTime() + i * 24 * 60 * 60 * 1000);
            const dátumStr = formázDátum(vizsgáltDátum);
            try {
                const response = await fetch(`${activeChannel}_schedule_${dátumStr}.json?t=${new Date().getTime()}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.schedule && Array.isArray(data.schedule)) {
                        kombináltMűsor = kombináltMűsor.concat(data.schedule);
                    }
                }
            } catch (innerError) { console.log("Schedule hiba"); }
        }

        const now = new Date();
        let currentTrack = null;
        epgRowsContainer.innerHTML = '';

        kombináltMűsor.forEach(track => {
            const trackStart = parseLocalISO(track.start);
            const trackEnd = new Date(trackStart.getTime() + track.duration * 1000);
            if (trackEnd >= now) {
                const napInfo = trackStart.toLocaleDateString('hu-HU', { month: 'short', day: 'numeric', weekday: 'short' });
                const óraPerc = `${String(trackStart.getHours()).padStart(2, '0')}:${String(trackStart.getMinutes()).padStart(2, '0')}`;
                epgRowsContainer.innerHTML += `
                    <div style="display:flex; align-items:center; padding:12px; border-bottom:1px solid #1f2633; font-size:18px;">
                        <div style="color:#ffb300; min-width:140px; font-weight:bold; font-size:15px;">${napInfo} ${óraPerc}</div>
                        <div style="color:white; font-weight:bold;">${track.title}</div>
                    </div>`;
            }
            if (now >= trackStart && now < trackEnd) { currentTrack = track; }
        });

        if (currentTrack) {
            if (!forceBlackoutActive) { overlay.style.display = 'none'; }
            lblShow.innerText = currentTrack.title;
            currentTrackRatio = currentTrack.ratio || "";
            
            const trackStart = parseLocalISO(currentTrack.start);
            const trackEnd = new Date(trackStart.getTime() + currentTrack.duration * 1000);
            const startHours = String(trackStart.getHours()).padStart(2, '0');
            const startMinutes = String(trackStart.getMinutes()).padStart(2, '0');
            const endHours = String(trackEnd.getHours()).padStart(2, '0');
            const endMinutes = String(trackEnd.getMinutes()).padStart(2, '0');
            lblTime.innerText = `${startHours}:${startMinutes} - ${endHours}:${endMinutes}`;

            let secondsInTrack = Math.floor((now.getTime() - trackStart.getTime()) / 1000);
            if (isNaN(secondsInTrack) || secondsInTrack < 0) { secondsInTrack = 0; }

            // --- ÚJ KORHATÁR AUTOMATIKUS JSON MOTOR ---
            if (currentTrack.rating && currentTrack.rating !== "") {
                try {
                    const ratingResponse = await fetch(`korhatar_${currentTrack.rating}.json?t=${new Date().getTime()}`);
                    if (ratingResponse.ok) {
                        const rConfig = await ratingResponse.json();
                        if (rConfig.logo && rConfig.logo.url) {
                            currentRatingConfig = rConfig.logo;
                            ratingImg.src = rConfig.logo.url;
                            ratingImg.style.display = 'block';
                        }
                    } else { ratingImg.style.display = 'none'; currentRatingConfig = null; }
                } catch (e) { ratingImg.style.display = 'none'; currentRatingConfig = null; }
            } else { ratingImg.style.display = 'none'; currentRatingConfig = null; }

            updateLayersScale();
            updateFontSizes();

            if (!currentTrack.title.toLowerCase().includes('ajánló')) {
                if (secondsInTrack >= 10 && secondsInTrack <= 25) {
                    notifierTitle.innerText = currentTrack.title;
                    showNotifier.classList.add('active');
                } else { showNotifier.classList.remove('active'); }
            } else { showNotifier.classList.remove('active'); }

            const isEmbed = (currentTrack.url.includes('archive.org') && !currentTrack.url.toLowerCase().endsWith('.mp4')) || 
                            currentTrack.url.includes('ok.ru') ||
                            currentTrack.url.includes('vkvideo.ru') ||
                            currentTrack.url.includes('video_ext.php') ||
                            currentTrack.url.includes('vk.com');

            if (isEmbed) {
                vid.pause(); vid.style.display = 'none';
                let embedFrame = document.getElementById('embedFrame');

                if (secondsInTrack >= (currentTrack.duration - 4)) {
                    if (embedFrame) { embedFrame.style.display = 'none'; }
                    overlay.style.display = 'flex'; overlay.innerText = ""; 
                    lastRenderedUrl = ''; isIframeLoaded = false; 
                    return;
                }

                if (!isIframeLoaded || !embedFrame || lastRenderedUrl !== currentTrack.url) {
                    isIframeLoaded = true; lastRenderedUrl = currentTrack.url; 
                    triggerBlackoutIncert(); 
                    if (embedFrame) { embedFrame.remove(); }

                    let targetUrl = currentTrack.url;
                    if (targetUrl.includes('?')) { targetUrl = targetUrl.split('?')[0]; }
                    if (targetUrl.includes('ok.ru/video/')) { targetUrl = targetUrl.replace('ok.ru/video/', 'ok.ru/videoembed/'); }

                    const finalSrc = `${targetUrl}?autoplay=1&fromTime=${secondsInTrack}`;
                    embedFrame = document.createElement('iframe');
                    embedFrame.id = 'embedFrame';
                    embedFrame.style.position = 'absolute';
                    embedFrame.style.top = '0'; embedFrame.style.left = '0'; embedFrame.style.width = '100%'; embedFrame.style.height = '100%';
                    embedFrame.style.border = 'none'; embedFrame.style.zIndex = '2';
                    embedFrame.allow = "autoplay; encrypted-media; fullscreen";
                    embedFrame.src = finalSrc;
                    container.appendChild(embedFrame);
                    embedFrame.style.display = 'block';
                } else {
                    if (embedFrame) { embedFrame.style.display = 'block'; }
                }
            } else {
                lastRenderedUrl = ''; isIframeLoaded = false; 
                let embedFrame = document.getElementById('embedFrame');
                if (embedFrame) embedFrame.remove();
                vid.style.display = 'block';
                
                if (vid.src !== currentTrack.url) {
                    vid.src = currentTrack.url; vid.load(); vid.currentTime = secondsInTrack;
                    triggerBlackoutIncert(); 
                    vid.muted = false; vid.volume = 1.0; 
                    vid.play().catch(() => {
                        vid.muted = true;
                        vid.play().then(() => { setTimeout(() => { vid.muted = false; vid.volume = 1.0; }, 200); });
                    });
                } else {
                    if (Math.abs(vid.currentTime - secondsInTrack) > 5) { vid.currentTime = secondsInTrack; }
                    if (vid.paused) { vid.play().catch(e => {}); }
                    vid.muted = false; vid.volume = 1.0;
                }
            }
        } else {
            lastRenderedUrl = ''; isIframeLoaded = false;
            currentTrackRatio = "";
            showNotifier.classList.remove('active');
            ratingImg.style.display = 'none'; currentRatingConfig = null; // Rejtés ha nincs adás
            vid.pause(); vid.style.display = 'none'; 
            let embedFrame = document.getElementById('embedFrame');
            if (embedFrame) embedFrame.remove();
            archiveIframe.src = ''; archiveIframe.style.display = 'none';
            lblShow.innerText = "Betöltés..."; lblTime.innerText = "--:--";
            overlay.style.display = 'flex'; overlay.innerText = ""; 
        }
    } catch (error) {
        showNotifier.classList.remove('active');
        ratingImg.style.display = 'none'; currentRatingConfig = null;
        vid.pause(); vid.style.display = 'none'; 
        let embedFrame = document.getElementById('embedFrame');
        if (embedFrame) embedFrame.remove();
        overlay.style.display = 'flex'; overlay.innerText = ""; 
    }
}

window.addEventListener('DOMContentLoaded', () => {
    updateNotifierColor(); // ÚJ: a kezdeti (CineMaster) csatorna színét is beállítjuk induláskor
    runTvEngine(); 
    setInterval(runTvEngine, 5000); 
    setInterval(updateHuClockText, 1000); // ÚJ: az óra szövege másodpercenként frissül
    updateHuClockText();
});
</script>
